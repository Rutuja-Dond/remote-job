name: Daily job update

on:
  schedule:
    - cron: "47 2 * * *"   # 8:17 AM IST, early, so a delay still lands before 9
    - cron: "30 4 * * *"   # 10:00 AM IST backup, in case the first run is skipped
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh jobs
        run: python scripts/update_jobs.py

      - name: Commit updated jobs
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Daily job update $(date -u +%F)"
          git push

      - name: Send 9 AM alert (GitHub issue)
        if: hashFiles('new_jobs.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "New remote jobs $(TZ=Asia/Kolkata date +%F)" \
            --body-file new_jobs.md
